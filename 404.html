<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Glowly &middot; Page Not Found — Skincare &amp; Beauty</title>
    <!-- Favicon -->
 <link rel="icon" href="assets/fav.jpeg" type="image/jpeg">
    <meta name="description" content="Oops! The page you're looking for has wandered off. Return to Glowly for premium skincare and beauty products.">
    
    <!-- Tailwind + Fonts + Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#831843',
                            secondary: '#BE185D',
                            accent: '#EC4899',
                            'accent-light': '#F472B6',
                            'accent-dark': '#9D174D',
                            blush: '#FDF2F8',
                            rose: '#FB7185',
                            gold: '#F59E0B',
                            bg: '#FDF2F8',
                            card: '#FFFFFF',
                            dark: '#0F0A0A',
                            'dark-card': '#1A0A0A',
                        }
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'serif'],
                        body: ['"Inter"', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body {
            transition: background-color 0.3s, color 0.3s;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        @keyframes floatSpa {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        .float-spa {
            animation: floatSpa 6s ease-in-out infinite;
        }

        @keyframes floatSpaDelayed {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-3deg); }
        }
        .float-spa-delayed {
            animation: floatSpaDelayed 7s ease-in-out infinite;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        .slow-zoom {
            animation: slowZoom 28s ease-in-out infinite alternate;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-text {
            background: linear-gradient(90deg, #EC4899, #F472B6, #EC4899);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite;
        }

        .btn-shine {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        .btn-shine:hover::after {
            left: 100%;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
        }
        .dark .glass-card {
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(2px);
        }

        /* RTL overrides */
        [dir="rtl"] .rtl\:right-auto {
            right: auto;
        }
        [dir="rtl"] .rtl\:left-0 {
            left: 0;
        }
        [dir="rtl"] .rtl\:rotate-180 {
            transform: rotate(180deg);
        }

        /* Dark mode fixes */
        .dark .fa-sun {
            display: none !important;
        }
        .dark .fa-moon {
            display: inline-block !important;
        }
        .fa-moon {
            display: none;
        }
        .fa-sun {
            display: inline-block;
        }

        button, a, [role="button"] {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        * {
            max-width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body class="bg-[#FDF2F8] dark:bg-[#0F0A0A] min-h-[100dvh] w-screen overflow-hidden flex items-center justify-center font-body antialiased transition-colors duration-300 relative px-3 py-6 sm:py-12">

    <!-- Rich overlay gradients -->
    <div class="fixed inset-0 bg-gradient-to-br from-[#FDF2F8]/80 via-transparent to-[#FDF2F8]/85 dark:from-[#0F0A0A]/80 dark:via-[#0F0A0A]/50 dark:to-[#0F0A0A]/85"></div>
    <div class="fixed inset-0 opacity-30 pointer-events-none" style="background: radial-gradient(circle at 30% 40%, rgba(236,72,153,0.12) 0%, transparent 60%);"></div>
    <div class="fixed inset-0 opacity-20 pointer-events-none mix-blend-multiply dark:mix-blend-normal" style="background: radial-gradient(circle at 70% 60%, rgba(236,72,153,0.10) 0%, transparent 55%);"></div>

    <!-- Top Controls (RTL / Theme) -->
    <div class="absolute top-4 right-4 sm:top-6 sm:right-6 flex items-center gap-3 z-50 pointer-events-auto">
        <button id="rtl-toggle-404" class="w-10 h-10 rounded-full bg-white/80 dark:bg-black/60 backdrop-blur-md shadow-sm border border-[#EC4899]/40 flex items-center justify-center text-[#831843] dark:text-white hover:text-[#EC4899] hover:border-[#EC4899] transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-[#EC4899] active:scale-95" title="Toggle RTL">
            <i class="fas fa-exchange-alt text-xs"></i>
        </button>
        <button id="theme-toggle-404" class="w-10 h-10 rounded-full bg-white/80 dark:bg-black/60 backdrop-blur-md shadow-sm border border-[#EC4899]/40 flex items-center justify-center text-[#831843] dark:text-white hover:text-[#EC4899] hover:border-[#EC4899] transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-[#EC4899] active:scale-95" title="Toggle Theme">
            <i class="fas fa-sun text-sm"></i>
            <i class="fas fa-moon hidden text-sm"></i>
        </button>
    </div>

    <!-- Main Card -->
    <main class="w-full max-w-[950px] glass-card rounded-2xl sm:rounded-3xl shadow-2xl flex flex-col md:flex-row rtl:flex-row-reverse border border-gray-200 dark:border-white/10 relative z-10 overflow-hidden md:h-[480px]">

        <!-- Left Panel: 404 Content -->
        <div class="w-full md:w-1/2 p-5 sm:p-6 lg:p-8 flex flex-col justify-center bg-white/95 dark:bg-[#0F0A0A]/95">

            <!-- Brand Logo -->
            <div class="text-center mb-4 flex flex-col items-center">
                <a href="index.html" class="inline-block mb-4 select-none group">
                    <span class="text-2xl font-display font-extrabold tracking-tight text-[#831843] dark:text-white transition-colors">
                        GLOW<span class="text-[#EC4899]">LY</span>
                    </span>
                </a>
                <div class="relative inline-block">
                    <span class="text-7xl sm:text-8xl font-display font-bold text-[#EC4899]/20 dark:text-[#EC4899]/10 select-none">404</span>
                    <span class="absolute inset-0 flex items-center justify-center text-4xl sm:text-5xl font-display font-bold shimmer-text">404</span>
                </div>
                <h2 class="text-xl sm:text-2xl font-display font-bold text-[#831843] dark:text-white mt-1">Glow Not Found</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400 font-light mt-1">The page you're looking for has wandered off.</p>
            </div>

            <!-- Decorative spa icons -->
            <div class="flex justify-center gap-4 mb-4">
                <i class="fas fa-spa text-2xl text-[#EC4899]/40 float-spa"></i>
                <i class="fas fa-spa text-3xl text-[#EC4899]/60 float-spa-delayed"></i>
                <i class="fas fa-spa text-2xl text-[#EC4899]/40 float-spa" style="animation-delay: 2s;"></i>
            </div>

            <!-- Message -->
            <p class="text-center text-sm text-gray-600 dark:text-gray-300 max-w-sm mx-auto leading-relaxed">
                Looks like this glow has faded away. Don't worry, we have plenty of other radiant products waiting for you.
            </p>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-3 mt-5">
                <a href="index.html" class="btn-shine flex-1 text-center bg-[#EC4899] hover:bg-[#BE185D] text-white font-bold text-xs rounded-xl px-4 py-2.5 transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="shop.html" class="flex-1 text-center bg-gray-100 dark:bg-white/5 hover:bg-[#EC4899]/10 dark:hover:bg-[#EC4899]/20 text-[#831843] dark:text-white font-bold text-xs rounded-xl px-4 py-2.5 border border-gray-200 dark:border-white/10 transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-shopping-bag"></i> Shop Products
                </a>
            </div>

            <!-- Quick links -->
            <div class="flex flex-wrap justify-center gap-3 mt-4 text-[10px] font-medium text-gray-400 dark:text-gray-500">
                <a href="about.html" class="hover:text-[#EC4899] transition-colors">About</a>
                <span class="text-gray-300 dark:text-gray-600">•</span>
                <a href="services.html" class="hover:text-[#EC4899] transition-colors">Services</a>
                <span class="text-gray-300 dark:text-gray-600">•</span>
                <a href="contact.html" class="hover:text-[#EC4899] transition-colors">Contact</a>
            </div>
        </div>

        <!-- Right Panel: Skincare Atmosphere -->
        <div class="hidden md:flex w-full md:w-1/2 relative text-white flex-col items-center justify-center overflow-hidden rounded-r-2xl rtl:rounded-r-none rtl:rounded-l-2xl border-l border-gray-200 dark:border-white/10">
            <img src="assets/service.jpg" alt="Skincare & Beauty" class="absolute inset-0 w-full h-full object-cover slow-zoom">
            <div class="absolute inset-0 bg-gradient-to-b from-[#0F0A0A]/60 via-transparent to-[#0F0A0A]/80"></div>
            <div class="absolute right-0 top-0 bottom-0 w-1 bg-[#EC4899]/80 rtl:right-auto rtl:left-0"></div>

            
        </div>
    </main>

    <script>
        (function() {
            // Theme toggle
            const themeToggle = document.getElementById('theme-toggle-404');
            const htmlTag = document.documentElement;

            function updateThemeIcons() {
                const isDark = htmlTag.classList.contains('dark');
                const sunIcon = document.querySelector('#theme-toggle-404 .fa-sun');
                const moonIcon = document.querySelector('#theme-toggle-404 .fa-moon');
                if (sunIcon && moonIcon) {
                    if (isDark) {
                        sunIcon.classList.add('hidden');
                        moonIcon.classList.remove('hidden');
                    } else {
                        sunIcon.classList.remove('hidden');
                        moonIcon.classList.add('hidden');
                    }
                }
            }

            function toggleTheme() {
                if (htmlTag.classList.contains('dark')) {
                    htmlTag.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    htmlTag.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                updateThemeIcons();
            }
            if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

            // Initialize theme
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('prefers-color-scheme: dark').matches)) {
                htmlTag.classList.add('dark');
            } else {
                htmlTag.classList.remove('dark');
            }
            updateThemeIcons();

            // RTL Toggle
            const rtlToggle = document.getElementById('rtl-toggle-404');

            function applyRTLStyles(isRtl) {
                if (isRtl) {
                    htmlTag.setAttribute('dir', 'rtl');
                    localStorage.setItem('direction', 'rtl');
                } else {
                    htmlTag.removeAttribute('dir');
                    localStorage.setItem('direction', 'ltr');
                }
            }

            function toggleRTL() {
                const currentDir = htmlTag.getAttribute('dir');
                if (currentDir === 'rtl') {
                    applyRTLStyles(false);
                } else {
                    applyRTLStyles(true);
                }
            }
            if (rtlToggle) rtlToggle.addEventListener('click', toggleRTL);
            if (localStorage.getItem('direction') === 'rtl') {
                htmlTag.setAttribute('dir', 'rtl');
            } else if (localStorage.getItem('direction') === 'ltr') {
                htmlTag.removeAttribute('dir');
            }

            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (e.key === 'h' || e.key === 'H') {
                    window.location.href = 'index.html';
                }
                if (e.key === 's' || e.key === 'S') {
                    window.location.href = 'shop.html';
                }
            });
        })();
    </script>
</body>

</html>
