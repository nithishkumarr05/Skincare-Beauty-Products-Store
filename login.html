<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Glowly &middot; Login — Skincare &amp; Beauty</title>
    <!-- Favicon -->
 <link rel="icon" href="assets/fav.jpeg" type="image/jpeg">
    <meta name="description" content="Login to Glowly — access your account, track orders, manage your skincare routine, and enjoy premium beauty perks.">
    
    <!-- Tailwind + Fonts + Icons -->
    <script src="tailwind.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#831843',
                            secondary: '#BE185D',
                            accent: '#EC4899',
                            'accent-light': '#F472B6',
                            'accent-dark': '#9D174D',
                            blush: '#FDF2F8',
                            rose: '#FB7185',
                            gold: '#F59E0B',
                            bg: '#FDF2F8',
                            card: '#FFFFFF',
                            dark: '#0F0A0A',
                            'dark-card': '#1A0A0A',
                        }
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'serif'],
                        body: ['"Inter"', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body {
            transition: background-color 0.3s, color 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .hide-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .hide-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar-thumb {
            background: #EC4899;
            border-radius: 10px;
        }
        .hide-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #EC4899 transparent;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        .slow-zoom {
            animation: slowZoom 28s ease-in-out infinite alternate;
        }

        @keyframes floatPop {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .float-pop {
            animation: floatPop 6s ease-in-out infinite;
        }

        .btn-shine {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        .btn-shine:hover::after {
            left: 100%;
        }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        .toast-animation {
            animation: toastFade 2.5s ease forwards;
        }

        [dir="rtl"] .rtl\:right-auto {
            right: auto;
        }
        [dir="rtl"] .rtl\:left-0 {
            left: 0;
        }
        [dir="rtl"] .rtl\:rotate-180 {
            transform: rotate(180deg);
        }
        [dir="rtl"] .me-2 {
            margin-left: 0.5rem;
            margin-right: 0;
        }
        [dir="rtl"] .ms-2 {
            margin-right: 0.5rem;
            margin-left: 0;
        }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #f9f9f9 inset !important;
        }
        .dark input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #0a0a0a inset !important;
            -webkit-text-fill-color: #e5e5e5 !important;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
        }
        .dark .glass-card {
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(2px);
        }

        .animated-border {
            position: relative;
            background: linear-gradient(60deg, #EC4899, #F472B6, #EC4899);
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 400px) {
            .glass-card .p-6, .glass-card .p-8, .glass-card>div:last-child {
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
            .glass-card {
                border-radius: 1.5rem !important;
            }
            .glass-card .text-center.mb-6 {
                margin-bottom: 0.5rem !important;
            }
            .glass-card .flex.justify-center.gap-3 {
                margin-bottom: 0.5rem !important;
            }
            .glass-card form.space-y-5 {
                gap: 0.75rem !important;
            }
            .glass-card .mt-7 {
                margin-top: 0.5rem !important;
            }
        }

        @media (max-height: 750px) and (max-width: 400px) {
            .glass-card .text-center.mb-6 {
                margin-bottom: 0.25rem !important;
            }
            .glass-card .text-2xl {
                font-size: 1.25rem !important;
            }
            .social-login-btn {
                height: 2.25rem !important;
            }
            .glass-card input {
                padding-top: 0.5rem !important;
                padding-bottom: 0.5rem !important;
            }
            .glass-card button[type="submit"] {
                padding-top: 0.5rem !important;
                padding-bottom: 0.5rem !important;
            }
        }

        body {
            overflow-x: hidden;
        }
        .w-screen {
            width: 100vw;
            overflow-x: hidden;
        }

        [dir="rtl"] input,
        [dir="rtl"] label,
        [dir="rtl"] button,
        [dir="rtl"] p,
        [dir="rtl"] h2 {
            text-align: right;
        }
        [dir="rtl"] .text-center {
            text-align: center;
        }
        [dir="rtl"] .me-2 {
            margin-left: 0.5rem;
            margin-right: 0;
        }
        [dir="rtl"] .ms-2 {
            margin-right: 0.5rem;
            margin-left: 0;
        }
        .max-h-[95dvh] {
            max-height: 95dvh;
        }

        button,
        a,
        [role="button"] {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        * {
            max-width: 100%;
            box-sizing: border-box;
        }

        .dark .fa-sun {
            display: none !important;
        }
        .dark .fa-moon {
            display: inline-block !important;
        }
        .fa-moon {
            display: none;
        }
        .fa-sun {
            display: inline-block;
        }

        .login-input {
            width: 100%;
            padding: 0.65rem 1rem;
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s;
            color: #0F172A;
            font-family: 'Inter', sans-serif;
        }
        .dark .login-input {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: #F1F5F9;
        }
        .login-input:focus {
            outline: none;
            border-color: #EC4899;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.15);
        }
        .login-input::placeholder {
            color: #94A3B8;
        }
        .dark .login-input::placeholder {
            color: #64748B;
        }

        .social-login-btn {
            flex: 1;
            height: 40px;
            background: #F8FAFC;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .dark .social-login-btn {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }
        .social-login-btn:hover {
            background: rgba(236, 72, 153, 0.08);
            border-color: #EC4899;
        }
        .dark .social-login-btn:hover {
            background: rgba(236, 72, 153, 0.15);
        }
        .social-login-btn i {
            font-size: 1.1rem;
        }

        .btn-primary-custom {
            background: #EC4899;
            color: #FFFFFF;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
            height: 44px;
            font-size: 0.85rem;
        }
        .btn-primary-custom:hover {
            background: #BE185D;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(236, 72, 153, 0.4);
        }
    </style>
</head>

<body class="bg-[#FDF2F8] dark:bg-[#0F0A0A] min-h-[100dvh] w-screen overflow-y-auto flex items-center justify-center font-body antialiased transition-colors duration-300 relative px-3 py-6 sm:py-12">

    <!-- Rich overlay gradients -->
    <div class="fixed inset-0 bg-gradient-to-br from-[#FDF2F8]/80 via-transparent to-[#FDF2F8]/85 dark:from-[#0F0A0A]/80 dark:via-[#0F0A0A]/50 dark:to-[#0F0A0A]/85"></div>
    <div class="fixed inset-0 opacity-30 pointer-events-none" style="background: radial-gradient(circle at 30% 40%, rgba(236,72,153,0.12) 0%, transparent 60%);"></div>
    <div class="fixed inset-0 opacity-20 pointer-events-none mix-blend-multiply dark:mix-blend-normal" style="background: radial-gradient(circle at 70% 60%, rgba(236,72,153,0.10) 0%, transparent 55%);"></div>

    <!-- Top Controls (RTL / Theme) -->
    <div class="absolute top-4 right-4 sm:top-6 sm:right-6 flex items-center gap-3 z-50 pointer-events-auto">
        <button id="rtl-toggle-login" class="w-10 h-10 rounded-full bg-white/80 dark:bg-black/60 backdrop-blur-md shadow-sm border border-[#EC4899]/40 flex items-center justify-center text-[#831843] dark:text-white hover:text-[#EC4899] hover:border-[#EC4899] transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-[#EC4899] active:scale-95" title="Toggle RTL">
            <i class="fas fa-exchange-alt text-xs"></i>
        </button>
        <button id="theme-toggle-login" class="w-10 h-10 rounded-full bg-white/80 dark:bg-black/60 backdrop-blur-md shadow-sm border border-[#EC4899]/40 flex items-center justify-center text-[#831843] dark:text-white hover:text-[#EC4899] hover:border-[#EC4899] transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-[#EC4899] active:scale-95" title="Toggle Theme">
            <i class="fas fa-sun text-sm"></i>
            <i class="fas fa-moon hidden text-sm"></i>
        </button>
    </div>

    <!-- Main Card -->
    <main class="w-full max-w-[950px] glass-card rounded-2xl sm:rounded-3xl shadow-2xl flex flex-col md:flex-row rtl:flex-row-reverse border border-gray-200 dark:border-white/10 relative z-10 overflow-hidden md:h-[480px]">

        <!-- Left Panel: Login Form -->
        <div class="w-full md:w-1/2 p-5 sm:p-6 lg:p-8 flex flex-col justify-center bg-white/95 dark:bg-[#0F0A0A]/95">

            <!-- Brand Logo & Welcome Header -->
            <div class="text-center mb-4 flex flex-col items-center">
                <a href="index.html" class="inline-block mb-3 select-none group">
                    <span class="text-2xl font-display font-extrabold tracking-tight text-[#831843] dark:text-white transition-colors">
                        GLOW<span class="text-[#EC4899]">LY</span>
                    </span>
                </a>
                <h2 class="text-xl sm:text-2xl font-display font-bold text-[#831843] dark:text-white mb-0.5">Welcome Back</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400 font-light">Sign in to your Glowly account.</p>
            </div>

            <!-- Social login row -->
            <div class="flex justify-center md:justify-start gap-3 sm:gap-4 mb-4">
                <button class="social-login-btn">
                    <i class="fab fa-google text-[#DB4437]"></i>
                </button>
                <button class="social-login-btn">
                    <i class="fab fa-facebook-f text-[#1877F2]"></i>
                </button>
                <button class="social-login-btn">
                    <i class="fab fa-apple text-[#0F172A] dark:text-white"></i>
                </button>
            </div>

            <div class="relative flex items-center justify-center my-3">
                <div class="w-full border-t border-gray-200 dark:border-white/10"></div>
                <div class="absolute bg-white dark:bg-[#0F0A0A] px-3 text-[9px] font-bold text-gray-400 tracking-widest uppercase">Or login with email</div>
            </div>

            <form class="space-y-3" id="loginForm">
                <div class="text-left">
                    <label class="block text-[11px] font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wide mb-1">
                        <i class="fas fa-envelope me-1.5 text-[#EC4899]"></i> Email Address
                    </label>
                    <input type="email" id="loginEmail" placeholder="hello@glowly.com" class="login-input" required>
                </div>

                <div class="text-left">
                    <label class="block text-[11px] font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wide mb-1">
                        <i class="fas fa-lock me-1.5 text-[#EC4899]"></i> Password
                    </label>
                    <div class="relative">
                        <input type="password" id="loginPassword" placeholder="••••••••" class="login-input" required>
                        <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pe-3 flex items-center text-gray-400 hover:text-[#EC4899] transition-colors focus:outline-none ltr:right-0 rtl:left-0 rtl:right-auto rtl:ps-3 rtl:pe-0">
                            <i class="fas fa-eye-slash text-xs" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-0.5 flex-wrap gap-2">
                    <label class="flex items-center cursor-pointer group">
                        <input type="checkbox" id="rememberCheckbox" class="w-3.5 h-3.5 rounded border-gray-300 text-[#EC4899] focus:ring-[#EC4899] cursor-pointer bg-transparent">
                        <span class="ms-2 text-xs font-medium text-gray-500 dark:text-gray-400 group-hover:text-[#831843] dark:group-hover:text-white transition-colors">Remember me</span>
                    </label>
                    <a href="#" id="forgotPasswordLink" class="text-xs font-bold text-[#831843] dark:text-gray-300 uppercase tracking-wide hover:text-[#EC4899] dark:hover:text-[#EC4899] transition-colors">Forgot Password</a>
                </div>

                <button type="submit" class="btn-shine w-full mt-2 h-10 bg-[#EC4899] hover:bg-[#BE185D] text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg hover:shadow-xl group focus:outline-none focus:ring-2 focus:ring-[#EC4899] active:scale-[0.98]">
                    <i class="fas fa-spa text-xs transform group-hover:scale-110 transition-transform"></i>
                    Sign In
                </button>
            </form>

            <div class="mt-4 text-center md:text-left">
                <p class="text-[12px] font-medium text-gray-500 dark:text-gray-400">New to Glowly?
                    <a href="register.html" class="font-bold text-[#EC4899] hover:text-[#BE185D] transition-colors border-b border-transparent hover:border-[#EC4899] pb-0.5 ml-1">Create an account →</a>
                </p>
            </div>
        </div>

        <!-- Right Panel: Skincare & Beauty Atmosphere -->
        <div class="hidden md:flex w-full md:w-1/2 relative text-white flex-col items-center justify-center overflow-hidden rounded-r-2xl rtl:rounded-r-none rtl:rounded-l-2xl border-l border-gray-200 dark:border-white/10">
            <img src="assets/service.jpg" alt="Skincare & Beauty" class="absolute inset-0 w-full h-full object-cover slow-zoom">
            <div class="absolute inset-0 bg-gradient-to-b from-[#0F0A0A]/60 via-transparent to-[#0F0A0A]/80"></div>
            <div class="absolute right-0 top-0 bottom-0 w-1 bg-[#EC4899]/80 rtl:right-auto rtl:left-0"></div>

            
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-auto max-w-[90vw]"></div>

    <script>
        (function() {
            // Toast function
            function showToast(message, type = 'success') {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                let bgColor = 'bg-emerald-600';
                let icon = '<i class="fas fa-check-circle text-white text-sm"></i>';
                if (type === 'error') { bgColor = 'bg-red-500'; icon = '<i class="fas fa-times-circle text-white text-sm"></i>'; }
                else if (type === 'warning') { bgColor = 'bg-amber-500'; icon = '<i class="fas fa-exclamation-triangle text-white text-sm"></i>'; }
                else if (type === 'info') { bgColor = '#EC4899'; icon = '<i class="fas fa-info-circle text-white text-sm"></i>'; }
                toast.className = `toast-animation mb-2 px-5 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 pointer-events-auto text-white max-w-full`;
                toast.style.backgroundColor = bgColor;
                toast.innerHTML = `${icon} <span class="break-words">${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => { if (toast && toast.remove) toast.remove(); }, 2600);
            }

            // Password toggle
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const passwordInput = document.getElementById('loginPassword');
            const toggleIcon = document.getElementById('toggleIcon');
            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', () => {
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        toggleIcon.classList.remove('fa-eye-slash');
                        toggleIcon.classList.add('fa-eye');
                    } else {
                        passwordInput.type = 'password';
                        toggleIcon.classList.remove('fa-eye');
                        toggleIcon.classList.add('fa-eye-slash');
                    }
                });
            }

            // Theme toggle
            const themeToggle = document.getElementById('theme-toggle-login');
            const htmlTag = document.documentElement;

            function updateThemeIcons() {
                const isDark = htmlTag.classList.contains('dark');
                const sunIcon = document.querySelector('#theme-toggle-login .fa-sun');
                const moonIcon = document.querySelector('#theme-toggle-login .fa-moon');
                if (sunIcon && moonIcon) {
                    if (isDark) {
                        sunIcon.classList.add('hidden');
                        moonIcon.classList.remove('hidden');
                    } else {
                        sunIcon.classList.remove('hidden');
                        moonIcon.classList.add('hidden');
                    }
                }
            }

            function toggleTheme() {
                if (htmlTag.classList.contains('dark')) {
                    htmlTag.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                    showToast('Light mode activated ☀️', 'info');
                } else {
                    htmlTag.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    showToast('Dark mode activated 🌙', 'info');
                }
                updateThemeIcons();
            }
            if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

            // Initialize theme
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('prefers-color-scheme: dark').matches)) {
                htmlTag.classList.add('dark');
            } else {
                htmlTag.classList.remove('dark');
            }
            updateThemeIcons();

            // RTL Toggle
            const rtlToggle = document.getElementById('rtl-toggle-login');

            function applyRTLStyles(isRtl) {
                if (isRtl) {
                    htmlTag.setAttribute('dir', 'rtl');
                    localStorage.setItem('direction', 'rtl');
                } else {
                    htmlTag.removeAttribute('dir');
                    localStorage.setItem('direction', 'ltr');
                }
            }

            function toggleRTL() {
                const currentDir = htmlTag.getAttribute('dir');
                if (currentDir === 'rtl') {
                    applyRTLStyles(false);
                    showToast('LTR layout activated', 'info');
                } else {
                    applyRTLStyles(true);
                    showToast('RTL layout activated', 'info');
                }
            }
            if (rtlToggle) rtlToggle.addEventListener('click', toggleRTL);
            if (localStorage.getItem('direction') === 'rtl') {
                htmlTag.setAttribute('dir', 'rtl');
            } else if (localStorage.getItem('direction') === 'ltr') {
                htmlTag.removeAttribute('dir');
            }

            // Remember me logic
            const savedEmail = localStorage.getItem('savedEmail');
            const rememberCheckbox = document.getElementById('rememberCheckbox');
            const emailInput = document.getElementById('loginEmail');
            if (savedEmail && emailInput) {
                emailInput.value = savedEmail;
                if (rememberCheckbox) rememberCheckbox.checked = true;
            }

            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = document.getElementById('loginEmail').value.trim();
                    const password = document.getElementById('loginPassword').value;
                    if (!email) { showToast('Please enter your email address', 'warning'); return; }
                    if (!password) { showToast('Please enter your password', 'warning'); return; }
                    if (!email.includes('@') || !email.includes('.')) { showToast('Please enter a valid email address', 'error'); return; }

                    if (rememberCheckbox && rememberCheckbox.checked) {
                        localStorage.setItem('savedEmail', email);
                    } else {
                        localStorage.removeItem('savedEmail');
                    }
                    const userName = email.split('@')[0];
                    showToast(`✨ Welcome back, ${userName}! Your glow journey continues.`, 'success');
                    // Uncomment to redirect: setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
                });
            }

            // Social login demo
            document.querySelectorAll('.social-login-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    showToast('Social login demo — integrate your auth provider', 'info');
                });
            });

            // Forgot password demo
            const forgotLink = document.getElementById('forgotPasswordLink');
            if (forgotLink) {
                forgotLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    showToast('Password reset link will be sent to your email', 'info');
                });
            }

            // Fix for keyboard open on mobile
            const mainCard = document.querySelector('main');
            if (mainCard) {
                const inputs = mainCard.querySelectorAll('input');
                inputs.forEach(inp => {
                    inp.addEventListener('focus', () => {
                        setTimeout(() => {
                            if (mainCard) {
                                mainCard.scrollTo({ top: mainCard.scrollHeight, behavior: 'smooth' });
                            }
                        }, 200);
                    });
                });
            }
        })();
    </script>
</body>
</html>
